{{- if .Values.whatsappfrontend.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-whatsapp-httproute
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ .Release.Name }}-gateway
    sectionName: https-whatsapp
  hostnames:
  - "whatsapp.{{ .Values.gateway.domain }}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /webhook
    - path:
        type: PathPrefix
        value: /        
    backendRefs:
    - name: {{ .Release.Name }}-whatsapp-frontend
      port: 80
{{- end }}
