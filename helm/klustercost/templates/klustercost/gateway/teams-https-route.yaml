{{- if .Values.teams.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-teams-httproute
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ .Release.Name }}-gateway
    sectionName:  https-teams
  hostnames:
  - "teams.{{ .Values.gateway.domain }}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/
    - path:
        type: PathPrefix
        value: /        
    backendRefs:
    - name: {{ .Release.Name }}-teams-frontend
      port: 80
{{- end }}
